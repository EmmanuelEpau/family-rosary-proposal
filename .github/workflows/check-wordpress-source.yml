name: Check WordPress source

on:
  pull_request:
    paths:
      - 'wordpress/**'
      - 'composer.json'
      - 'composer.lock'
      - '.phpcs.xml.dist'
      - '.github/workflows/check-wordpress-source.yml'

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: git ls-files -z -- 'wordpress/*.php' | xargs -0 -n1 php -l
      - name: Check WordPress VIP and PHP compatibility
        run: vendor/bin/phpcs -p
